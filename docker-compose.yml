services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver_dll
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "9702@kokab"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
    restart: unless-stopped

  app:
    build: .
    container_name: inventory_management_app
    depends_on:
      - sqlserver
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=InventoryManagementDB;User Id=sa;Password=9702@kokab;TrustServerCertificate=True;"
    restart: unless-stopped

volumes:
  sql_data: